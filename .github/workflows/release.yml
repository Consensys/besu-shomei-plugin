name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {} # lock everything by default (least-privilege)

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: ./gradlew build -PreleaseVersion="$VERSION"

      - name: Test with Gradle
        run: ./gradlew test

      - name: Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cp "./build/libs/besu-shomei-plugin-${VERSION}-test-support.jar" \
             "./build/libs/besu-shomei-plugin-test-support-${VERSION}.jar"
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "Draft release of version ${VERSION}." \
            --draft \
            "./build/distributions/besu-shomei-plugin-${VERSION}.zip" \
            "./build/libs/besu-shomei-plugin-test-support-${VERSION}.jar"
